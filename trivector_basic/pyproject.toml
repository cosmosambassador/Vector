[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "aisi-trivector-basic"
version = "0.1.0"
description = "AISI Vector continuity metrics and MC-6 OWL research records"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
include = ["mc6_grimoire*"]

[tool.setuptools.package-data]
mc6_grimoire = ["bridge_data.json"]
